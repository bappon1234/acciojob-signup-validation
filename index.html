<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signup From</title>
    <link rel="styleSheet" href="style.css">
</head>

<body>

    <main class="container">
        <form id="signup-form" novalidate>
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="Example@email.com"
                    aria-describedby="email-feedback" required />
                <p id="email-feedback" class="error-msg" aria-live="polite">Make sure email is more than 3 characters
                    and has @ and a .</p>
            </div>


            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Your Password"
                    aria-describedby="password-feedback" required />
                <p id="password-feedback" class="error-msg" aria-live="polite">Make sure password is more than 8
                    characters.</p>
            </div>

            <p id="success-msg" class="success-msg hidden" aria-live="polite">
                All good to go
            </p>


            <button type="submit" id="submit-btn">Submit</button>
        </form>
    </main>

    <script src="script.js"></script>

</body>

</html>
